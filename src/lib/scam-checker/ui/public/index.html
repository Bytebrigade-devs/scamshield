<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ScamShield — Check a suspicious message</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <span class="wordmark">
        <svg class="wordmark__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        ScamShield
      </span>
      <nav class="site-nav" aria-label="Scam checker">
        <button id="nav-check" class="nav-link" type="button" aria-current="page">Check message</button>
        <button id="nav-history" class="nav-link" type="button">History</button>
      </nav>
      <div id="check-progress" class="progress-track" hidden aria-hidden="true"><span class="progress-track__bar"></span></div>
    </header>

    <main id="main" class="page">
      <div id="view" class="page__inner"></div>
    </main>

    <noscript>
      <p class="noscript">Enable JavaScript to check a message and view your check history.</p>
    </noscript>

    <pre id="print-summary" class="print-summary" aria-hidden="true"></pre>
    <script type="module" src="/app.js"></script>
  </body>
</html>
