<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 980" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#000000">Activity Diagram — Account Moderation &amp; Audit Trail</text>

  <!-- ================= SWIMLANE HEADERS (CLASSIC DRAW.IO STYLE) ================= -->
  <rect x="50" y="90" width="340" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="220" y="115" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Administrator (Client UI)</text>

  <rect x="390" y="90" width="370" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="575" y="115" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">RBAC &amp; Moderation Controller</text>

  <rect x="760" y="90" width="340" height="40" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="930" y="115" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Supabase PostgreSQL Audit Store</text>

  <!-- Swimlane Body Lanes -->
  <rect x="50" y="130" width="340" height="810" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="390" y="130" width="370" height="810" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="760" y="130" width="340" height="810" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>

  <!-- ================= NODES ================= -->

  <!-- Initial Node (Solid Black Circle) -->
  <circle cx="220" cy="165" r="12" fill="#000000"/>
  <line x1="220" y1="177" x2="220" y2="210" stroke="#333333" stroke-width="1.5"/>
  <polygon points="216,210 220,218 224,210" fill="#333333"/>

  <!-- Action 1: Search & Filter Users -->
  <rect x="110" y="218" width="220" height="44" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="220" y="245" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Search &amp; Filter User Directory</text>

  <line x1="220" y1="262" x2="220" y2="295" stroke="#333333" stroke-width="1.5"/>
  <polygon points="216,295 220,303 224,295" fill="#333333"/>

  <!-- Action 2: Inspect Account Profile -->
  <rect x="110" y="303" width="220" height="52" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="220" y="325" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Select User &amp; Inspect Profile</text>
  <text x="220" y="342" font-size="10" fill="#666666" text-anchor="middle">(Plan, Joined Date, Scam Check Count)</text>

  <!-- Connect to Controller (Lane 2) -->
  <line x1="330" y1="329" x2="475" y2="329" stroke="#333333" stroke-width="1.5"/>
  <polygon points="475,325 483,329 475,333" fill="#333333"/>

  <!-- Action 3: Zero-Knowledge Filter -->
  <rect x="485" y="303" width="200" height="52" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="585" y="325" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">Zero-Knowledge Filter (M5)</text>
  <text x="585" y="342" font-size="10" fill="#333333" text-anchor="middle">Masks passwords &amp; raw messages</text>

  <!-- Connect back to Admin Lane -->
  <line x1="585" y1="355" x2="585" y2="395" stroke="#333333" stroke-width="1.5"/>
  <line x1="585" y1="395" x2="220" y2="395" stroke="#333333" stroke-width="1.5"/>
  <line x1="220" y1="395" x2="220" y2="425" stroke="#333333" stroke-width="1.5"/>
  <polygon points="216,425 220,433 224,425" fill="#333333"/>

  <!-- Action 4: Click Suspend -->
  <rect x="110" y="433" width="220" height="44" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="220" y="460" font-size="11" font-weight="bold" fill="#b85450" text-anchor="middle">Click "Suspend Account"</text>

  <!-- Connect to Decision -->
  <line x1="330" y1="455" x2="525" y2="455" stroke="#333333" stroke-width="1.5"/>
  <polygon points="525,451 533,455 525,459" fill="#333333"/>

  <!-- Decision Diamond (Yellow: #fff2cc / #d6b656) -->
  <polygon points="585,425 645,455 585,485 525,455" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" filter="url(#drawio-shadow)"/>
  <text x="585" y="451" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Role ==</text>
  <text x="585" y="465" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">'Admin'?</text>

  <!-- [No] Branch: Unauthorized -->
  <line x1="645" y1="455" x2="700" y2="455" stroke="#b85450" stroke-width="1.5"/>
  <text x="670" y="445" font-size="10" font-weight="bold" fill="#b85450" text-anchor="middle">[No]</text>
  <line x1="700" y1="455" x2="700" y2="520" stroke="#b85450" stroke-width="1.5"/>
  <line x1="700" y1="520" x2="330" y2="520" stroke="#b85450" stroke-width="1.5"/>
  <polygon points="330,516 322,520 330,524" fill="#b85450"/>

  <!-- Error Node: Display 403 -->
  <rect x="110" y="500" width="210" height="42" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="215" y="518" font-size="10" font-weight="bold" fill="#b85450" text-anchor="middle">Display 403 Forbidden Modal</text>
  <text x="215" y="533" font-size="9" fill="#666666" text-anchor="middle">"Only Admin role can suspend (M5-10)"</text>

  <!-- Aborted End State -->
  <line x1="215" y1="542" x2="215" y2="565" stroke="#b85450" stroke-width="1.5"/>
  <polygon points="211,565 215,573 219,565" fill="#b85450"/>
  <circle cx="215" cy="582" r="13" fill="none" stroke="#b85450" stroke-width="2"/>
  <circle cx="215" cy="582" r="7" fill="#b85450"/>
  <text x="215" y="612" font-size="10" font-weight="bold" fill="#b85450" text-anchor="middle">Operation Terminated</text>

  <!-- [Yes] Branch: Open Reason Modal -->
  <line x1="585" y1="485" x2="585" y2="550" stroke="#274e13" stroke-width="1.5"/>
  <text x="600" y="515" font-size="10" font-weight="bold" fill="#274e13">[Yes]</text>
  <polygon points="581,550 585,558 589,550" fill="#274e13"/>

  <rect x="475" y="558" width="220" height="44" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="585" y="585" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Prompt for Audit Justification</text>

  <!-- Connect to Admin entering reason -->
  <line x1="475" y1="580" x2="330" y2="580" stroke="#333333" stroke-width="1.5"/>
  <polygon points="330,576 322,580 330,584" fill="#333333"/>

  <!-- Admin inputs justification -->
  <rect x="110" y="640" width="220" height="48" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="220" y="662" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Enter Justification &amp; Confirm</text>
  <text x="220" y="677" font-size="9" fill="#666666" text-anchor="middle">(e.g., "Abusive API rate limit bursts")</text>

  <!-- Connect back to Controller -->
  <line x1="330" y1="664" x2="475" y2="664" stroke="#333333" stroke-width="1.5"/>
  <polygon points="475,660 483,664 475,668" fill="#333333"/>

  <!-- Controller sets status -->
  <rect x="475" y="640" width="220" height="48" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="585" y="662" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Set User Status = 'Suspended'</text>
  <text x="585" y="677" font-size="9" fill="#666666" text-anchor="middle">Freeze API Token &amp; Active Sessions</text>

  <!-- Connect to Database (Lane 3) -->
  <line x1="695" y1="664" x2="815" y2="664" stroke="#333333" stroke-width="1.5"/>
  <polygon points="815,660 823,664 815,668" fill="#333333"/>

  <!-- DB Update -->
  <rect x="825" y="640" width="210" height="48" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="930" y="662" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">UPDATE public.users</text>
  <text x="930" y="677" font-size="10" fill="#666666" text-anchor="middle">SET status = 'Suspended'</text>

  <!-- Connect to Audit Log Write -->
  <line x1="930" y1="688" x2="930" y2="725" stroke="#333333" stroke-width="1.5"/>
  <polygon points="926,725 930,733 934,725" fill="#333333"/>

  <!-- Write Immutable Audit Log (Green) -->
  <rect x="800" y="733" width="260" height="64" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8" filter="url(#drawio-shadow)"/>
  <text x="930" y="755" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">INSERT INTO public.audit_logs</text>
  <text x="930" y="771" font-size="10" fill="#000000" text-anchor="middle">AdminEmail, Action, Target, Reason, IP</text>
  <text x="930" y="787" font-size="9" fill="#666666" text-anchor="middle">🔒 Append-Only (UPDATE/DELETE Forbidden)</text>

  <!-- Return to UI -->
  <line x1="930" y1="797" x2="930" y2="835" stroke="#333333" stroke-width="1.5"/>
  <line x1="930" y1="835" x2="220" y2="835" stroke="#333333" stroke-width="1.5"/>
  <line x1="220" y1="835" x2="220" y2="865" stroke="#333333" stroke-width="1.5"/>
  <polygon points="216,865 220,873 224,865" fill="#333333"/>

  <!-- UI Refreshes -->
  <rect x="110" y="873" width="220" height="44" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
  <text x="220" y="893" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Refresh User Management UI</text>
  <text x="220" y="908" font-size="9" fill="#b85450" text-anchor="middle">Status Badge turns Red · Audit Log Updated</text>

  <!-- Final Success Node (Black Bullseye) -->
  <line x1="220" y1="917" x2="220" y2="940" stroke="#333333" stroke-width="1.5"/>
  <circle cx="220" cy="950" r="14" fill="none" stroke="#000000" stroke-width="2"/>
  <circle cx="220" cy="950" r="8" fill="#000000"/>
</svg>
