<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 920" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#000000">Sequence Diagram — Analytics Request &amp; Zero-Knowledge Telemetry</text>
  <text x="40" y="60" font-size="12" fill="#666666">IS2901 Software Development Project · M5 Admin Analytics Pipeline (M5-03, M5-04, M5-05, X-13)</text>

  <!-- ================= LIFELINE HEADERS (CLASSIC DRAW.IO STYLE) ================= -->

  <!-- Lifeline 1: Admin -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Administrator</text>
    <line x1="55" y1="42" x2="55" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 2: AdminUI (Next.js) -->
  <g transform="translate(210, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">UI: Next.js Client</text>
    <line x1="65" y1="42" x2="65" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 3: AdminAPI Route -->
  <g transform="translate(380, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">API: Route Handler</text>
    <line x1="65" y1="42" x2="65" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 4: RBAC Guard -->
  <g transform="translate(550, 95)">
    <rect x="0" y="0" width="120" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="60" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">RBAC Guard</text>
    <line x1="60" y1="42" x2="60" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 5: M2 Subscriptions -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="120" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="60" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M2 Subscriptions</text>
    <line x1="60" y1="42" x2="60" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 6: M4 AI Scam Pipeline -->
  <g transform="translate(870, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M4 Scam Engine</text>
    <line x1="55" y1="42" x2="55" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 7: Supabase Audit Store -->
  <g transform="translate(1010, 95)">
    <rect x="0" y="0" width="100" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="50" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Audit Store</text>
    <line x1="50" y1="42" x2="50" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- ================= ACTIVATION BARS ================= -->
  <rect x="270" y="165" width="10" height="595" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="440" y="205" width="10" height="520" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="605" y="245" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="765" y="355" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="920" y="430" width="10" height="70" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1055" y="530" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1055" y="670" width="10" height="35" fill="#ffffff" stroke="#666666" stroke-width="1"/>

  <!-- ================= MESSAGES & FLOW ================= -->

  <!-- 1. Admin navigates to Analytics -->
  <line x1="115" y1="170" x2="270" y2="170" stroke="#333333" stroke-width="1.5"/>
  <polygon points="265,166 270,170 265,174" fill="#333333"/>
  <text x="190" y="162" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">1: Navigate to /admin/analytics</text>

  <!-- 2. UI dispatches GET request -->
  <line x1="280" y1="210" x2="440" y2="210" stroke="#333333" stroke-width="1.5"/>
  <polygon points="435,206 440,210 435,214" fill="#333333"/>
  <text x="360" y="202" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">2: GET /api/admin/analytics (Bearer Token)</text>

  <!-- 3. Verify RBAC -->
  <line x1="450" y1="250" x2="605" y2="250" stroke="#333333" stroke-width="1.5"/>
  <polygon points="600,246 605,250 600,254" fill="#333333"/>
  <text x="525" y="242" font-size="11" fill="#000000" text-anchor="middle">3: verifyRole(token, ['admin'])</text>

  <!-- 4. RBAC Authorized -->
  <line x1="605" y1="285" x2="450" y2="285" stroke="#274e13" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="455,281 450,285 455,289" fill="#274e13"/>
  <text x="525" y="278" font-size="10" font-weight="bold" fill="#274e13" text-anchor="middle">4: { authorized: true, role: 'admin' }</text>

  <!-- PARALLEL DATA FETCHING FRAME (CLASSIC DRAW.IO PAR BOX) -->
  <rect x="360" y="315" width="750" height="280" rx="4" fill="#f5f5f5" stroke="#666666" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polygon points="360,315 420,315 430,335 360,335" fill="#e1d5e7" stroke="#9673a6" stroke-width="1"/>
  <text x="390" y="329" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">par</text>
  <text x="445" y="329" font-size="10" font-style="italic" fill="#666666">[Parallel Analytics Telemetry Fetching]</text>

  <!-- 5a. Query M2 Subscriptions -->
  <line x1="450" y1="360" x2="765" y2="360" stroke="#333333" stroke-width="1.5"/>
  <polygon points="760,356 765,360 760,364" fill="#333333"/>
  <text x="605" y="352" font-size="11" fill="#000000" text-anchor="middle">5a: getSubscriptionMetrics()</text>

  <!-- 5a return -->
  <line x1="765" y1="395" x2="450" y2="395" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="455,391 450,395 455,399" fill="#666666"/>
  <text x="605" y="388" font-size="10" fill="#000000" text-anchor="middle">return { Sentinel: 52, Guardian: 40, Aegis: 18, MRR: 39600 }</text>

  <!-- 5b. Query M4 Scam Engine -->
  <line x1="450" y1="435" x2="920" y2="435" stroke="#333333" stroke-width="1.5"/>
  <polygon points="915,431 920,435 915,439" fill="#333333"/>
  <text x="685" y="427" font-size="11" fill="#000000" text-anchor="middle">5b: getCategoryDistribution(X-13 Taxonomy)</text>

  <!-- Privacy barrier yellow note in draw.io style -->
  <g transform="translate(740, 445)">
    <rect x="0" y="0" width="300" height="26" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
    <text x="150" y="17" font-size="10" font-weight="bold" fill="#b45f06" text-anchor="middle">🔒 PRIVACY BOUNDARY: Raw message bodies excluded</text>
  </g>

  <!-- 5b return -->
  <line x1="920" y1="495" x2="450" y2="495" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="455,491 450,495 455,499" fill="#666666"/>
  <text x="685" y="488" font-size="10" fill="#000000" text-anchor="middle">return { Phishing: 410, JobScam: 230, Delivery: 170, Other: 90 }</text>

  <!-- 5c. Query Funnel Events from DB -->
  <line x1="450" y1="535" x2="1055" y2="535" stroke="#333333" stroke-width="1.5"/>
  <polygon points="1050,531 1055,535 1050,539" fill="#333333"/>
  <text x="750" y="527" font-size="11" fill="#000000" text-anchor="middle">5c: getFunnelDropoffTelemetry()</text>

  <!-- 5c return -->
  <line x1="1055" y1="570" x2="450" y2="570" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="455,566 450,570 455,574" fill="#666666"/>
  <text x="750" y="563" font-size="10" fill="#000000" text-anchor="middle">return { Landing: 1430, Started: 610, Finished: 290, Signup: 120 }</text>

  <!-- 6. Local computation -->
  <rect x="410" y="615" width="230" height="32" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="525" y="635" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Compute Churn (5.2%) &amp; Cohort Retention</text>

  <!-- 7. Record Access in Audit Log -->
  <line x1="450" y1="675" x2="1055" y2="675" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="1050,671 1055,675 1050,679" fill="#274e13"/>
  <text x="750" y="667" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">7: logAuditAction("ANALYTICS_QUERY", admin_email, IP)</text>

  <!-- 8. Return response payload -->
  <line x1="440" y1="715" x2="280" y2="715" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="285,711 280,715 285,719" fill="#666666"/>
  <text x="360" y="708" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">8: 200 OK (Aggregated Analytics JSON)</text>

  <!-- 9. UI Renders Charts -->
  <line x1="270" y1="755" x2="115" y2="755" stroke="#333333" stroke-width="1.5"/>
  <polygon points="120,751 115,755 120,759" fill="#333333"/>
  <text x="190" y="748" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">9: Render Recharts &amp; Cohort Matrix</text>
</svg>
