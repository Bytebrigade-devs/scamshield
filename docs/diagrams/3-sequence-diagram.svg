<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 920" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#000000">Sequence Diagram — Module 5: Admin Analytics &amp; Telemetry Aggregation</text>

  <!-- ================= LIFELINE HEADERS (CLASSIC DRAW.IO STYLE) ================= -->

  <!-- Lifeline 1: Admin -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Administrator</text>
    <line x1="55" y1="42" x2="55" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 2: AdminUI (Next.js) -->
  <g transform="translate(220, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Admin Client UI</text>
    <line x1="65" y1="42" x2="65" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 3: AdminController -->
  <g transform="translate(390, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Analytics API</text>
    <line x1="65" y1="42" x2="65" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 4: RBAC Guard -->
  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="120" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="60" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: RBAC Guard</text>
    <line x1="60" y1="42" x2="60" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 5: MetricsAggregator -->
  <g transform="translate(720, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Metrics Engine</text>
    <line x1="65" y1="42" x2="65" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 6: AuditLogger -->
  <g transform="translate(885, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Audit Logger</text>
    <line x1="55" y1="42" x2="55" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 7: PostgreSQL Database -->
  <g transform="translate(1020, 95)">
    <rect x="0" y="0" width="100" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="50" y="26" font-size="12" font-weight="bold" fill="#274e13" text-anchor="middle">PostgreSQL DB</text>
    <line x1="50" y1="42" x2="50" y2="780" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- ================= ACTIVATION BARS ================= -->
  <rect x="280" y="165" width="10" height="595" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="450" y="205" width="10" height="520" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="615" y="245" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="780" y="340" width="10" height="260" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="935" y="655" width="10" height="50" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1065" y="370" width="10" height="210" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1065" y="675" width="10" height="30" fill="#ffffff" stroke="#666666" stroke-width="1"/>

  <!-- ================= MESSAGES & FLOW ================= -->

  <!-- 1. Admin navigates to Analytics -->
  <line x1="115" y1="170" x2="280" y2="170" stroke="#333333" stroke-width="1.5"/>
  <polygon points="275,166 280,170 275,174" fill="#333333"/>
  <text x="195" y="162" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">1: Navigate to /admin/analytics</text>

  <!-- 2. UI dispatches GET request -->
  <line x1="290" y1="210" x2="450" y2="210" stroke="#333333" stroke-width="1.5"/>
  <polygon points="445,206 450,210 445,214" fill="#333333"/>
  <text x="370" y="202" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">2: GET /api/admin/analytics (Bearer Token)</text>

  <!-- 3. Verify RBAC -->
  <line x1="460" y1="250" x2="615" y2="250" stroke="#333333" stroke-width="1.5"/>
  <polygon points="610,246 615,250 610,254" fill="#333333"/>
  <text x="535" y="242" font-size="11" fill="#000000" text-anchor="middle">3: verifyRole(token, ['admin', 'analyst'])</text>

  <!-- 4. RBAC Authorized -->
  <line x1="615" y1="285" x2="460" y2="285" stroke="#274e13" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="465,281 460,285 465,289" fill="#274e13"/>
  <text x="535" y="278" font-size="10" font-weight="bold" fill="#274e13" text-anchor="middle">4: { authorized: true, role: 'admin' }</text>

  <!-- 5. Forward to Metrics Engine -->
  <line x1="460" y1="345" x2="780" y2="345" stroke="#333333" stroke-width="1.5"/>
  <polygon points="775,341 780,345 775,349" fill="#333333"/>
  <text x="620" y="338" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">5: calculateMetrics(dateRange: '30d')</text>

  <!-- 6. Query Events & Summaries from DB -->
  <line x1="790" y1="380" x2="1065" y2="380" stroke="#333333" stroke-width="1.5"/>
  <polygon points="1060,376 1065,380 1060,384" fill="#333333"/>
  <text x="925" y="372" font-size="10" fill="#000000" text-anchor="middle">6a: SELECT plan, status FROM user_profiles</text>

  <line x1="1065" y1="415" x2="790" y2="415" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="795,411 790,415 795,419" fill="#666666"/>
  <text x="925" y="408" font-size="10" fill="#000000" text-anchor="middle">return active subscribers &amp; plan tiers</text>

  <line x1="790" y1="455" x2="1065" y2="455" stroke="#333333" stroke-width="1.5"/>
  <polygon points="1060,451 1065,455 1060,459" fill="#333333"/>
  <text x="925" y="448" font-size="10" fill="#000000" text-anchor="middle">6b: SELECT event_name, metadata FROM analytics_events</text>

  <!-- Privacy Post-It Note -->
  <g transform="translate(800, 470)">
    <rect x="0" y="0" width="250" height="24" rx="3" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
    <text x="125" y="16" font-size="9" font-weight="bold" fill="#b45f06" text-anchor="middle">🔒 PRIVACY: Telemetry metadata only (No message text)</text>
  </g>

  <line x1="1065" y1="520" x2="790" y2="520" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="795,516 790,520 795,524" fill="#666666"/>
  <text x="925" y="513" font-size="10" fill="#000000" text-anchor="middle">return funnel counts &amp; category tags (X-13)</text>

  <!-- 7. Compute aggregations -->
  <rect x="760" y="545" width="210" height="32" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="865" y="565" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">Compute MRR (39,600), Churn &amp; Funnel %</text>

  <!-- 8. Return computed metrics to API -->
  <line x1="780" y1="600" x2="460" y2="600" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="465,596 460,600 465,604" fill="#666666"/>
  <text x="620" y="593" font-size="10" fill="#000000" text-anchor="middle">return AggregatedMetrics payload</text>

  <!-- 9. Trigger Audit Logger -->
  <line x1="460" y1="655" x2="935" y2="655" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="930,651 935,655 930,659" fill="#274e13"/>
  <text x="695" y="648" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">9: logAudit("ANALYTICS_QUERY", admin_email, IP)</text>

  <line x1="945" y1="680" x2="1065" y2="680" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="1060,676 1065,680 1060,684" fill="#274e13"/>
  <text x="1005" y="673" font-size="9" fill="#274e13" text-anchor="middle">INSERT audit_logs</text>

  <!-- 10. Return JSON to UI -->
  <line x1="450" y1="720" x2="290" y2="720" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="295,716 290,720 295,724" fill="#666666"/>
  <text x="370" y="713" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">10: 200 OK (Analytics JSON Payload)</text>

  <!-- 11. UI Renders Charts -->
  <line x1="280" y1="755" x2="115" y2="755" stroke="#333333" stroke-width="1.5"/>
  <polygon points="120,751 115,755 120,759" fill="#333333"/>
  <text x="195" y="748" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">11: Render Recharts &amp; Cohort Matrix</text>
</svg>
