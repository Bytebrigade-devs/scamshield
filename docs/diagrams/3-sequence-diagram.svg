<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#000000">Sequence Diagram — Automated Alerts, Baseline Anomalies &amp; Recommendations</text>

  <!-- ================= LIFELINE HEADERS (CLASSIC DRAW.IO STYLE) ================= -->

  <!-- Lifeline 1: Admin -->
  <g transform="translate(45, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Administrator</text>
    <line x1="55" y1="42" x2="55" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 2: AdminUI (Next.js) -->
  <g transform="translate(195, 95)">
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="65" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Admin Client UI</text>
    <line x1="65" y1="42" x2="65" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 3: Alert & Analytics API -->
  <g transform="translate(365, 95)">
    <rect x="0" y="0" width="140" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="70" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Alert &amp; Analytics API</text>
    <line x1="70" y1="42" x2="70" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 4: Anomaly Engine (7-Day Baseline) -->
  <g transform="translate(545, 95)">
    <rect x="0" y="0" width="150" height="42" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="75" y="20" font-size="11" font-weight="bold" fill="#b45f06" text-anchor="middle">⭐ Anomaly Engine</text>
    <text x="75" y="34" font-size="9" fill="#333333" text-anchor="middle">(7-Day Rolling Baseline)</text>
    <line x1="75" y1="42" x2="75" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 5: Recommendation Rule Engine -->
  <g transform="translate(735, 95)">
    <rect x="0" y="0" width="150" height="42" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="75" y="20" font-size="11" font-weight="bold" fill="#b45f06" text-anchor="middle">⭐ Rule Engine</text>
    <text x="75" y="34" font-size="9" fill="#333333" text-anchor="middle">(Recommended Actions)</text>
    <line x1="75" y1="42" x2="75" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 6: AuditLogger -->
  <g transform="translate(920, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">M5: Audit Logger</text>
    <line x1="55" y1="42" x2="55" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- Lifeline 7: PostgreSQL Database -->
  <g transform="translate(1060, 95)">
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="55" y="26" font-size="12" font-weight="bold" fill="#274e13" text-anchor="middle">PostgreSQL DB</text>
    <line x1="55" y1="42" x2="55" y2="820" stroke="#666666" stroke-dasharray="4 4" stroke-width="1.2"/>
  </g>

  <!-- ================= ACTIVATION BARS ================= -->
  <rect x="255" y="165" width="10" height="645" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="430" y="195" width="10" height="440" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="615" y="235" width="10" height="150" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="805" y="405" width="10" height="100" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="970" y="735" width="10" height="65" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1110" y="265" width="10" height="90" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1110" y="555" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="1110" y="755" width="10" height="45" fill="#ffffff" stroke="#666666" stroke-width="1"/>

  <!-- ================= MESSAGES & FLOW ================= -->

  <!-- 1. Admin navigates to Overview -->
  <line x1="100" y1="170" x2="255" y2="170" stroke="#333333" stroke-width="1.5"/>
  <polygon points="250,166 255,170 250,174" fill="#333333"/>
  <text x="175" y="162" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">1: Open /admin Overview</text>

  <!-- 2. UI dispatches GET request -->
  <line x1="265" y1="200" x2="430" y2="200" stroke="#333333" stroke-width="1.5"/>
  <polygon points="425,196 430,200 425,204" fill="#333333"/>
  <text x="345" y="192" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">2: GET /api/admin/alerts-and-metrics</text>

  <!-- 3. API calls Anomaly Engine -->
  <line x1="440" y1="240" x2="615" y2="240" stroke="#333333" stroke-width="1.5"/>
  <polygon points="610,236 615,240 610,244" fill="#333333"/>
  <text x="525" y="232" font-size="10.5" font-weight="bold" fill="#b45f06" text-anchor="middle">3: detectAnomalies(window: '7d')</text>

  <!-- 4. Anomaly Engine queries DB -->
  <line x1="625" y1="270" x2="1110" y2="270" stroke="#333333" stroke-width="1.5"/>
  <polygon points="1105,266 1110,270 1105,274" fill="#333333"/>
  <text x="865" y="262" font-size="10" fill="#000000" text-anchor="middle">4: SELECT 7-day baseline averages &amp; live counts FROM analytics_events</text>

  <!-- 5. DB returns data -->
  <line x1="1110" y1="330" x2="625" y2="330" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="630,326 625,330 630,334" fill="#666666"/>
  <text x="865" y="322" font-size="10" fill="#000000" text-anchor="middle">5: return historical baseline &amp; live telemetry streams</text>

  <!-- 6. Anomaly Engine detects spikes -->
  <rect x="555" y="350" width="190" height="28" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="650" y="368" font-size="9.5" font-weight="bold" fill="#b85450" text-anchor="middle">Detect: Scam Warnings +40% vs 7d</text>

  <!-- 7. Forward to Recommendation Engine -->
  <line x1="625" y1="410" x2="805" y2="410" stroke="#333333" stroke-width="1.5"/>
  <polygon points="800,406 805,410 800,414" fill="#333333"/>
  <text x="715" y="402" font-size="10" font-weight="bold" fill="#b45f06" text-anchor="middle">7: mapActionToEvent(anomalies)</text>

  <!-- 8. Rule engine matches actions -->
  <rect x="745" y="430" width="220" height="34" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
  <text x="855" y="445" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">Rule: +40% Scam Warnings &#8594;</text>
  <text x="855" y="458" font-size="9" font-weight="bold" fill="#004085" text-anchor="middle">Action: "Review scam activity trends"</text>

  <!-- 9. Return enriched alert to API -->
  <line x1="805" y1="490" x2="440" y2="490" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="445,486 440,490 445,494" fill="#666666"/>
  <text x="620" y="482" font-size="10" fill="#000000" text-anchor="middle">9: return SystemAlert(severity: 'Warning', suggested_action, target_route: '/admin/scams')</text>

  <!-- 10. Store in automated_alerts table -->
  <line x1="440" y1="560" x2="1110" y2="560" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="1105,556 1110,560 1105,564" fill="#274e13"/>
  <text x="775" y="552" font-size="10" fill="#274e13" text-anchor="middle">10: INSERT INTO public.automated_alerts (event, delta_pct, recommended_action)</text>

  <!-- 11. Return JSON to Admin UI -->
  <line x1="430" y1="620" x2="265" y2="620" stroke="#666666" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="270,616 265,620 270,624" fill="#666666"/>
  <text x="345" y="612" font-size="10.5" font-weight="bold" fill="#000000" text-anchor="middle">11: 200 OK (Alerts + Recommendations JSON)</text>

  <!-- 12. UI renders alert card -->
  <line x1="255" y1="655" x2="100" y2="655" stroke="#333333" stroke-width="1.5"/>
  <polygon points="105,651 100,655 105,659" fill="#333333"/>
  <text x="175" y="648" font-size="10" fill="#b85450" text-anchor="middle">12: Render Alert Banner &amp; Action Card</text>

  <!-- 13. Admin clicks recommended action -->
  <line x1="100" y1="695" x2="255" y2="695" stroke="#004085" stroke-width="1.8"/>
  <polygon points="250,691 255,695 250,699" fill="#004085"/>
  <text x="175" y="688" font-size="10" font-weight="bold" fill="#004085" text-anchor="middle">13: Click [Review Scam Activity Trends]</text>

  <!-- 14. UI routes to /admin/scams and triggers audit log -->
  <line x1="265" y1="735" x2="970" y2="735" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="965,731 970,735 965,739" fill="#274e13"/>
  <text x="615" y="728" font-size="10" font-weight="bold" fill="#274e13" text-anchor="middle">14: logAudit("ALERT_INVESTIGATED", target: "ScamTrends", reason: "+40% spike")</text>

  <!-- 15. Audit Logger writes to DB -->
  <line x1="980" y1="760" x2="1110" y2="760" stroke="#274e13" stroke-width="1.5"/>
  <polygon points="1105,756 1110,760 1105,764" fill="#274e13"/>
  <text x="1045" y="752" font-size="9" fill="#274e13" text-anchor="middle">INSERT audit_logs</text>

  <!-- 16. UI renders focused scam view -->
  <line x1="255" y1="800" x2="100" y2="800" stroke="#333333" stroke-width="1.5"/>
  <polygon points="105,796 100,800 105,804" fill="#333333"/>
  <text x="175" y="792" font-size="10" font-weight="bold" fill="#274e13" text-anchor="middle">16: Display /admin/scams Focused Diagnostic View</text>

  <!-- Post-it Note at Bottom (Rule Mapping Table) -->
  <g transform="translate(360, 840)">
    <rect x="0" y="0" width="760" height="90" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1" filter="url(#drawio-shadow)"/>
    <text x="20" y="22" font-size="11" font-weight="bold" fill="#b45f06">⭐ Rule Engine Predefined Condition &amp; Action Mapping (M5):</text>
    <text x="20" y="42" font-size="10" fill="#333333">• <tspan font-weight="bold">Many failed login attempts</tspan> &#8594; Suggested action: <tspan font-weight="bold" fill="#004085">Review authentication logs</tspan></text>
    <text x="20" y="60" font-size="10" fill="#333333">• <tspan font-weight="bold">Password Vault unavailable</tspan> &#8594; Suggested action: <tspan font-weight="bold" fill="#b85450">Investigate the component's health</tspan></text>
    <text x="400" y="42" font-size="10" fill="#333333">• <tspan font-weight="bold">Missing score inputs</tspan> &#8594; Suggested action: <tspan font-weight="bold" fill="#274e13">Check data collection and integration</tspan></text>
    <text x="400" y="60" font-size="10" fill="#333333">• <tspan font-weight="bold">Increase in scam warnings (+40%)</tspan> &#8594; Suggested action: <tspan font-weight="bold" fill="#b45f06">Review scam activity trends</tspan></text>
    <text x="20" y="80" font-size="9" font-style="italic" fill="#666666">Historical comparison method: 7-day rolling window baseline averages against real-time hourly telemetry</text>
  </g>
</svg>
