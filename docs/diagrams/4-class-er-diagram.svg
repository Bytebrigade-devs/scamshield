<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 850" width="100%" height="100%" style="background:#080e1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Metadata -->
  <text x="50" y="45" font-size="22" font-weight="700" fill="#eaf1f7">ScamShield · Module 5 Class &amp; Database Architecture Diagram</text>
  <text x="50" y="70" font-size="12" fill="#8ea0b3">Entity-Relationship &amp; Object Model · Database: Supabase PostgreSQL (X-01, X-08)</text>

  <!-- ================= CLASS 1: AdminController ================= -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#0e1726" stroke="#2dd4bf" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="310" height="10" fill="#13203a"/>
    <text x="155" y="22" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle">&lt;&lt;Service&gt;&gt; AdminController</text>
    
    <!-- Attributes -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#8ea0b3">- currentRole: AdminRole</text>
    <text x="15" y="68" font-size="10" font-family="monospace" fill="#8ea0b3">- adminSession: AdminSession</text>
    <line x1="0" y1="78" x2="310" y2="78" stroke="#1f2d45" stroke-width="1"/>
    
    <!-- Methods -->
    <text x="15" y="96" font-size="10" font-family="monospace" fill="#eaf1f7">+ getExecutiveOverview(): OverviewMetrics</text>
    <text x="15" y="114" font-size="10" font-family="monospace" fill="#eaf1f7">+ searchUsers(query, filters): UserRecord[]</text>
    <text x="15" y="132" font-size="10" font-family="monospace" fill="#f06a6a">+ suspendUser(userId, reason): Status</text>
    <text x="15" y="150" font-size="10" font-family="monospace" fill="#34d399">+ reactivateUser(userId, reason): Status</text>
    <text x="15" y="168" font-size="10" font-family="monospace" fill="#eaf1f7">+ addSupportNote(userId, note): void</text>
    <text x="15" y="186" font-size="10" font-family="monospace" fill="#eaf1f7">+ exportCsvReport(filters): Blob</text>
    <text x="15" y="204" font-size="10" font-family="monospace" fill="#38bdf8">+ logAuditAction(action, target, details): void</text>
    <text x="15" y="222" font-size="10" font-family="monospace" fill="#eaf1f7">+ updateTicketStatus(tktId, status): void</text>
  </g>

  <!-- ================= CLASS 2: SafetyScoreCoordinator (M6) ================= -->
  <g transform="translate(50, 375)">
    <rect x="0" y="0" width="310" height="190" rx="8" fill="#0e1726" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="310" height="10" fill="#13203a"/>
    <text x="155" y="22" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;&lt;Coordinator&gt;&gt; SafetyScoreEngine (M6)</text>
    
    <!-- Attributes -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#8ea0b3">- formulaVersion: "1.0-draft"</text>
    <text x="15" y="68" font-size="10" font-family="monospace" fill="#8ea0b3">- inputThresholds: Map&lt;string, number&gt;</text>
    <line x1="0" y1="78" x2="310" y2="78" stroke="#1f2d45" stroke-width="1"/>
    
    <!-- Methods -->
    <text x="15" y="98" font-size="10" font-family="monospace" fill="#eaf1f7">+ aggregateScore(m2, m3, m4): ScoreCard</text>
    <text x="15" y="118" font-size="10" font-family="monospace" fill="#eaf1f7">+ getRiskCohorts(): CohortDistribution</text>
    <text x="15" y="138" font-size="10" font-family="monospace" fill="#eaf1f7">+ validatePrivacyBoundary(): boolean</text>
    <text x="15" y="158" font-size="10" font-family="monospace" fill="#8ea0b3">+ getActionRecommendations(): Action[]</text>
    <text x="15" y="178" font-size="9" fill="#2dd4bf">🔒 No payment or raw message input</text>
  </g>

  <!-- ================= DB TABLE 1: public.audit_logs ================= -->
  <g transform="translate(420, 105)">
    <rect x="0" y="0" width="320" height="230" rx="8" fill="#0e1726" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="320" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="320" height="10" fill="#13203a"/>
    <text x="160" y="22" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">&lt;&lt;Table&gt;&gt; public.audit_logs</text>
    
    <!-- Columns -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#34d399">+ id: UUID [PK, gen_random_uuid()]</text>
    <text x="15" y="70" font-size="10" font-family="monospace" fill="#eaf1f7">+ admin_id: UUID [FK -&gt; auth.users]</text>
    <text x="15" y="88" font-size="10" font-family="monospace" fill="#eaf1f7">+ admin_email: TEXT NOT NULL</text>
    <text x="15" y="106" font-size="10" font-family="monospace" fill="#eaf1f7">+ admin_role: TEXT CHECK(role IN ...)</text>
    <text x="15" y="124" font-size="10" font-family="monospace" fill="#eaf1f7">+ action: TEXT NOT NULL</text>
    <text x="15" y="142" font-size="10" font-family="monospace" fill="#eaf1f7">+ target_identifier: TEXT NOT NULL</text>
    <text x="15" y="160" font-size="10" font-family="monospace" fill="#eaf1f7">+ details: TEXT NOT NULL</text>
    <text x="15" y="178" font-size="10" font-family="monospace" fill="#8ea0b3">+ ip_address: TEXT</text>
    <text x="15" y="196" font-size="10" font-family="monospace" fill="#8ea0b3">+ user_agent: TEXT</text>
    <text x="15" y="214" font-size="10" font-family="monospace" fill="#8ea0b3">+ created_at: TIMESTAMPTZ DEFAULT NOW()</text>
  </g>

  <!-- ================= DB TABLE 2: public.support_tickets ================= -->
  <g transform="translate(790, 105)">
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#0e1726" stroke="#1f2d45" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="310" height="10" fill="#13203a"/>
    <text x="155" y="22" font-size="12" font-weight="700" fill="#eaf1f7" text-anchor="middle">&lt;&lt;Table&gt;&gt; public.support_tickets</text>
    
    <!-- Columns -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#34d399">+ id: UUID [PK]</text>
    <text x="15" y="70" font-size="10" font-family="monospace" fill="#eaf1f7">+ ticket_number: TEXT UNIQUE NOT NULL</text>
    <text x="15" y="88" font-size="10" font-family="monospace" fill="#eaf1f7">+ user_id: UUID [FK -&gt; auth.users]</text>
    <text x="15" y="106" font-size="10" font-family="monospace" fill="#eaf1f7">+ user_email: TEXT NOT NULL</text>
    <text x="15" y="124" font-size="10" font-family="monospace" fill="#eaf1f7">+ subject: TEXT NOT NULL</text>
    <text x="15" y="142" font-size="10" font-family="monospace" fill="#eaf1f7">+ category: TEXT CHECK(category IN ...)</text>
    <text x="15" y="160" font-size="10" font-family="monospace" fill="#f59e0b">+ status: TEXT DEFAULT 'Open'</text>
    <text x="15" y="178" font-size="10" font-family="monospace" fill="#eaf1f7">+ priority: TEXT DEFAULT 'Medium'</text>
    <text x="15" y="196" font-size="10" font-family="monospace" fill="#8ea0b3">+ internal_notes: TEXT</text>
    <text x="15" y="214" font-size="10" font-family="monospace" fill="#8ea0b3">+ created_at: TIMESTAMPTZ</text>
  </g>

  <!-- ================= DB TABLE 3: public.verdict_feedback ================= -->
  <g transform="translate(420, 375)">
    <rect x="0" y="0" width="320" height="200" rx="8" fill="#0e1726" stroke="#1f2d45" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="320" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="320" height="10" fill="#13203a"/>
    <text x="160" y="22" font-size="12" font-weight="700" fill="#eaf1f7" text-anchor="middle">&lt;&lt;Table&gt;&gt; public.verdict_feedback</text>
    
    <!-- Columns -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#34d399">+ id: UUID [PK]</text>
    <text x="15" y="70" font-size="10" font-family="monospace" fill="#eaf1f7">+ check_id: TEXT NOT NULL</text>
    <text x="15" y="88" font-size="10" font-family="monospace" fill="#eaf1f7">+ user_email: TEXT NOT NULL</text>
    <text x="15" y="106" font-size="10" font-family="monospace" fill="#2dd4bf">+ taxonomy_category: TEXT (X-13)</text>
    <text x="15" y="124" font-size="10" font-family="monospace" fill="#eaf1f7">+ system_verdict: TEXT NOT NULL</text>
    <text x="15" y="142" font-size="10" font-family="monospace" fill="#f06a6a">+ user_reaction: TEXT (False Positive/Neg)</text>
    <text x="15" y="160" font-size="10" font-family="monospace" fill="#8ea0b3">+ user_comment: TEXT</text>
    <text x="15" y="178" font-size="10" font-family="monospace" fill="#8ea0b3">+ status: TEXT DEFAULT 'Pending Review'</text>
  </g>

  <!-- ================= DB TABLE 4: public.analytics_events ================= -->
  <g transform="translate(790, 375)">
    <rect x="0" y="0" width="310" height="200" rx="8" fill="#0e1726" stroke="#1f2d45" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="310" height="10" fill="#13203a"/>
    <text x="155" y="22" font-size="12" font-weight="700" fill="#eaf1f7" text-anchor="middle">&lt;&lt;Table&gt;&gt; public.analytics_events</text>
    
    <!-- Columns -->
    <text x="15" y="52" font-size="10" font-family="monospace" fill="#34d399">+ id: UUID [PK]</text>
    <text x="15" y="70" font-size="10" font-family="monospace" fill="#eaf1f7">+ event_name: TEXT NOT NULL</text>
    <text x="15" y="88" font-size="10" font-family="monospace" fill="#eaf1f7">+ source_module: TEXT ('M1'..'M4')</text>
    <text x="15" y="106" font-size="10" font-family="monospace" fill="#8ea0b3">+ visitor_id: TEXT</text>
    <text x="15" y="124" font-size="10" font-family="monospace" fill="#8ea0b3">+ user_id: UUID [FK]</text>
    <text x="15" y="142" font-size="10" font-family="monospace" fill="#2dd4bf">+ metadata: JSONB NOT NULL</text>
    <text x="15" y="160" font-size="10" font-family="monospace" fill="#8ea0b3">+ created_at: TIMESTAMPTZ</text>
    <text x="15" y="180" font-size="9" fill="#34d399">Index on: event_name, created_at</text>
  </g>

  <!-- ================= DB VIEW: users_view ================= -->
  <g transform="translate(420, 615)">
    <rect x="0" y="0" width="680" height="190" rx="8" fill="#0e1726" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="680" height="34" rx="8" fill="#13203a"/>
    <rect x="0" y="24" width="680" height="10" fill="#13203a"/>
    <text x="340" y="22" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="middle">&lt;&lt;View&gt;&gt; public.admin_user_directory (M2 + M3 + M4 Aggregation)</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="15" font-size="10" font-family="monospace" fill="#eaf1f7">+ id: UUID (from auth.users)</text>
      <text x="0" y="35" font-size="10" font-family="monospace" fill="#eaf1f7">+ name: TEXT</text>
      <text x="0" y="55" font-size="10" font-family="monospace" fill="#eaf1f7">+ email: TEXT</text>
      <text x="0" y="75" font-size="10" font-family="monospace" fill="#2dd4bf">+ plan: TEXT ('Sentinel' | 'Guardian' | 'Aegis')</text>
      <text x="0" y="95" font-size="10" font-family="monospace" fill="#f59e0b">+ status: TEXT ('Active' | 'Trialing' | 'Cancelled' | 'Suspended')</text>
    </g>

    <g transform="translate(360, 50)">
      <text x="0" y="15" font-size="10" font-family="monospace" fill="#8ea0b3">+ joined_at: TIMESTAMPTZ</text>
      <text x="0" y="35" font-size="10" font-family="monospace" fill="#eaf1f7">+ checks_count: INT (from M4 logs)</text>
      <text x="0" y="55" font-size="10" font-family="monospace" fill="#eaf1f7">+ vault_count: INT (from M3 counts only)</text>
      <text x="0" y="75" font-size="10" font-family="monospace" fill="#34d399">+ monthly_billing: NUMERIC (mock LKR)</text>
      <text x="0" y="95" font-size="10" font-family="monospace" fill="#38bdf8">+ safety_score: INT (from M6 coordinator)</text>
    </g>
    
    <rect x="20" y="150" width="640" height="24" rx="4" fill="#13203a"/>
    <text x="340" y="166" font-size="9" fill="#8ea0b3" text-anchor="middle">🔒 Zero-Knowledge: Passwords, plaintext notes, and submitted scam bodies are EXCLUDED from this view</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->

  <!-- AdminController -> AuditLogs (1 to *) -->
  <line x1="360" y1="210" x2="420" y2="210" stroke="#34d399" stroke-width="2"/>
  <text x="375" y="202" font-size="10" fill="#34d399">1</text>
  <text x="405" y="202" font-size="10" fill="#34d399">*</text>

  <!-- AdminController -> UsersView -->
  <line x1="200" y1="335" x2="200" y2="700" stroke="#2dd4bf" stroke-width="1.5"/>
  <line x1="200" y1="700" x2="420" y2="700" stroke="#2dd4bf" stroke-width="1.5"/>
  <polygon points="415,696 423,700 415,704" fill="#2dd4bf"/>

  <!-- AdminController -> SupportTickets -->
  <line x1="360" y1="140" x2="790" y2="140" stroke="#8ea0b3" stroke-width="1.5"/>
  <polygon points="785,136 793,140 785,144" fill="#8ea0b3"/>

  <!-- AdminController -> VerdictFeedback -->
  <line x1="360" y1="280" x2="400" y2="280" stroke="#8ea0b3" stroke-width="1.5"/>
  <line x1="400" y1="280" x2="400" y2="450" stroke="#8ea0b3" stroke-width="1.5"/>
  <line x1="400" y1="450" x2="420" y2="450" stroke="#8ea0b3" stroke-width="1.5"/>
  <polygon points="415,446 423,450 415,454" fill="#8ea0b3"/>

  <!-- AdminController -> AnalyticsEvents -->
  <line x1="740" y1="450" x2="790" y2="450" stroke="#8ea0b3" stroke-width="1.5"/>
  <polygon points="785,446 793,450 785,454" fill="#8ea0b3"/>
</svg>
