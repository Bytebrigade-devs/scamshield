<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#000000">Subsystem Architecture — Module 5: Admin Dashboard, Analytics &amp; Operations</text>
  <text x="40" y="60" font-size="12" fill="#666666">IS2901 Software Development Project · Author: Vishmi Himaya (245027T) · 3-Tier Layered Architecture</text>

  <!-- ================= TIER 1: PRESENTATION LAYER ================= -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1060" height="180" fill="#ffffff" stroke="#6c8ebf" stroke-width="2" rx="4" filter="url(#drawio-shadow)"/>
    <rect x="0" y="0" width="1060" height="34" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="530" y="22" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">TIER 1: PRESENTATION LAYER (Next.js 14 App Router · React 18 · Tailwind CSS · Recharts)</text>

    <!-- Component 1: Overview -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="180" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="180" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="90" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Overview Dashboard</text>
      <text x="10" y="45" font-size="10" fill="#333333">• M5-14 Combined View</text>
      <text x="10" y="63" font-size="10" fill="#333333">• Signups &amp; MRR KPIs</text>
      <text x="10" y="81" font-size="10" fill="#333333">• Needs Attention Alerts</text>
      <text x="10" y="99" font-size="9" fill="#666666">Route: /admin</text>
    </g>

    <!-- Component 2: User Management -->
    <g transform="translate(235, 50)">
      <rect x="0" y="0" width="185" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="185" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="92" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">User Management UI</text>
      <text x="10" y="45" font-size="10" fill="#333333">• M5-09 Search &amp; Filter</text>
      <text x="10" y="63" font-size="10" fill="#333333">• Plan &amp; Status Badges</text>
      <text x="10" y="81" font-size="10" fill="#b85450">• Suspend/Reactivate Modal</text>
      <text x="10" y="99" font-size="9" fill="#666666">Route: /admin/users</text>
    </g>

    <!-- Component 3: Analytics -->
    <g transform="translate(445, 50)">
      <rect x="0" y="0" width="185" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="185" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="92" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Business Analytics UI</text>
      <text x="10" y="45" font-size="10" fill="#333333">• M5-05 Funnel Drop-off</text>
      <text x="10" y="63" font-size="10" fill="#333333">• M5-06 Cohort Matrix</text>
      <text x="10" y="81" font-size="10" fill="#274e13">• M5-07 CSV Export Button</text>
      <text x="10" y="99" font-size="9" fill="#666666">Route: /admin/analytics</text>
    </g>

    <!-- Component 4: Threat Feed -->
    <g transform="translate(655, 50)">
      <rect x="0" y="0" width="180" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="180" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="90" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Scam Intelligence UI</text>
      <text x="10" y="45" font-size="10" fill="#333333">• M5-04 Category Charts</text>
      <text x="10" y="63" font-size="10" fill="#333333">• AI Confidence Donut</text>
      <text x="10" y="81" font-size="10" fill="#333333">• X-13 Taxonomy Specs</text>
      <text x="10" y="99" font-size="9" fill="#666666">Route: /admin/scams</text>
    </g>

    <!-- Component 5: Support & Audit -->
    <g transform="translate(860, 50)">
      <rect x="0" y="0" width="170" height="110" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="170" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="85" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Support &amp; Audit UI</text>
      <text x="10" y="45" font-size="10" fill="#333333">• M5-11 Audit Log Table</text>
      <text x="10" y="63" font-size="10" fill="#333333">• M5-12 Support Tickets</text>
      <text x="10" y="81" font-size="10" fill="#333333">• Verdict Feedback List</text>
      <text x="10" y="99" font-size="9" fill="#666666">Route: /admin/support-audit</text>
    </g>
  </g>

  <!-- Connectors Tier 1 -> Tier 2 -->
  <line x1="590" y1="275" x2="590" y2="330" stroke="#333333" stroke-width="2"/>
  <polygon points="585,325 590,333 595,325" fill="#333333"/>
  <text x="610" y="305" font-size="11" font-weight="bold" fill="#000000">Next.js API Calls</text>

  <!-- ================= TIER 2: BUSINESS LOGIC & CONTROLLER LAYER ================= -->
  <g transform="translate(60, 335)">
    <rect x="0" y="0" width="1060" height="195" fill="#ffffff" stroke="#d6b656" stroke-width="2" rx="4" filter="url(#drawio-shadow)"/>
    <rect x="0" y="0" width="1060" height="34" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="530" y="22" font-size="13" font-weight="bold" fill="#b45f06" text-anchor="middle">TIER 2: BUSINESS LOGIC &amp; SERVICE CONTROLLERS (M5 Core)</text>

    <!-- Service 1: RBAC Simulator Guard -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="225" height="125" fill="#ffffff" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="225" height="26" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
      <text x="112" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">RBAC Policy Guard (M5-10)</text>
      <text x="10" y="48" font-size="10" fill="#333333">• Admin: full execution privileges</text>
      <text x="10" y="66" font-size="10" fill="#333333">• Support: read &amp; note adding only</text>
      <text x="10" y="84" font-size="10" fill="#333333">• Analyst: read-only telemetry</text>
      <text x="10" y="105" font-size="9" font-style="italic" fill="#274e13">Enforces 403 Forbidden on illegal action</text>
    </g>

    <!-- Service 2: Moderation Engine -->
    <g transform="translate(285, 50)">
      <rect x="0" y="0" width="235" height="125" fill="#ffffff" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="235" height="26" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
      <text x="117" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Moderation Controller (M5-09)</text>
      <text x="10" y="48" font-size="10" fill="#333333">• Validate target user status</text>
      <text x="10" y="66" font-size="10" fill="#333333">• Require written audit reason</text>
      <text x="10" y="84" font-size="10" fill="#333333">• Toggle active / suspended state</text>
      <text x="10" y="105" font-size="9" font-style="italic" fill="#b85450">Triggers append to AuditLogger</text>
    </g>

    <!-- Service 3: Analytics & Financial Engine -->
    <g transform="translate(550, 50)">
      <rect x="0" y="0" width="240" height="125" fill="#ffffff" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="240" height="26" fill="#fff2cc" stroke="#d6b656" stroke-width="1"/>
      <text x="120" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Metrics &amp; MRR Engine (M5-03, 05)</text>
      <text x="10" y="48" font-size="10" fill="#333333">• Calculate mock MRR (39,600 LKR)</text>
      <text x="10" y="66" font-size="10" fill="#333333">• Compute Funnel conversion %</text>
      <text x="10" y="84" font-size="10" fill="#333333">• Build Cohort retention matrix</text>
      <text x="10" y="105" font-size="9" font-style="italic" fill="#274e13">Streaming CSV Formatter (M5-07)</text>
    </g>

    <!-- Service 4: Immutable Audit Logger -->
    <g transform="translate(815, 50)">
      <rect x="0" y="0" width="220" height="125" fill="#ffffff" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="220" height="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
      <text x="110" y="18" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">Audit Logger (M5-11)</text>
      <text x="10" y="48" font-size="10" fill="#333333">• Capture: Actor, Action, Target</text>
      <text x="10" y="66" font-size="10" fill="#333333">• Capture: Timestamp, Reason, IP</text>
      <text x="10" y="84" font-size="10" fill="#333333">• Write to append-only ledger</text>
      <text x="10" y="105" font-size="9" font-style="italic" fill="#274e13">Non-repudiation audit trail</text>
    </g>
  </g>

  <!-- Connectors Tier 2 -> Tier 3 -->
  <line x1="590" y1="530" x2="590" y2="585" stroke="#333333" stroke-width="2"/>
  <polygon points="585,580 590,588 595,580" fill="#333333"/>
  <text x="610" y="560" font-size="11" font-weight="bold" fill="#000000">SQL Queries / RLS</text>

  <!-- ================= TIER 3: DATA & PERSISTENCE LAYER ================= -->
  <g transform="translate(60, 590)">
    <rect x="0" y="0" width="1060" height="205" fill="#ffffff" stroke="#82b366" stroke-width="2" rx="4" filter="url(#drawio-shadow)"/>
    <rect x="0" y="0" width="1060" height="34" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="530" y="22" font-size="13" font-weight="bold" fill="#274e13" text-anchor="middle">TIER 3: DATA &amp; STORAGE LAYER (PostgreSQL on Supabase · Schema X-01 / X-08)</text>

    <!-- Table 1: audit_logs -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="230" height="135" fill="#f5f5f5" stroke="#82b366" stroke-width="1.5" rx="4"/>
      <rect x="0" y="0" width="230" height="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
      <text x="115" y="18" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">public.audit_logs (M5-11)</text>
      <text x="10" y="46" font-size="10" font-family="monospace" fill="#000000">+ id: UUID [PK]</text>
      <text x="10" y="64" font-size="10" font-family="monospace" fill="#000000">+ admin_email: TEXT</text>
      <text x="10" y="82" font-size="10" font-family="monospace" fill="#000000">+ action: TEXT</text>
      <text x="10" y="100" font-size="10" font-family="monospace" fill="#000000">+ target_identifier: TEXT</text>
      <text x="10" y="118" font-size="9" font-style="italic" fill="#274e13">RLS: UPDATE/DELETE Denied</text>
    </g>

    <!-- Table 2: support_tickets -->
    <g transform="translate(290, 50)">
      <rect x="0" y="0" width="230" height="135" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="230" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="115" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">public.support_tickets</text>
      <text x="10" y="46" font-size="10" font-family="monospace" fill="#000000">+ id: UUID [PK]</text>
      <text x="10" y="64" font-size="10" font-family="monospace" fill="#000000">+ ticket_number: TEXT</text>
      <text x="10" y="82" font-size="10" font-family="monospace" fill="#000000">+ user_email: TEXT</text>
      <text x="10" y="100" font-size="10" font-family="monospace" fill="#000000">+ status: 'Open'|'Resolved'</text>
      <text x="10" y="118" font-size="9" fill="#666666">Indexed on status</text>
    </g>

    <!-- Table 3: verdict_feedback -->
    <g transform="translate(550, 50)">
      <rect x="0" y="0" width="230" height="135" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="230" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="115" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">public.verdict_feedback</text>
      <text x="10" y="46" font-size="10" font-family="monospace" fill="#000000">+ id: UUID [PK]</text>
      <text x="10" y="64" font-size="10" font-family="monospace" fill="#000000">+ check_id: TEXT</text>
      <text x="10" y="82" font-size="10" font-family="monospace" fill="#000000">+ user_reaction: TEXT</text>
      <text x="10" y="100" font-size="10" font-family="monospace" fill="#000000">+ taxonomy_category: TEXT</text>
      <text x="10" y="118" font-size="9" fill="#666666">User-flagged accuracy</text>
    </g>

    <!-- Table 4: analytics_events -->
    <g transform="translate(810, 50)">
      <rect x="0" y="0" width="220" height="135" fill="#f5f5f5" stroke="#666666" stroke-width="1" rx="4"/>
      <rect x="0" y="0" width="220" height="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
      <text x="110" y="18" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">public.analytics_events</text>
      <text x="10" y="46" font-size="10" font-family="monospace" fill="#000000">+ id: UUID [PK]</text>
      <text x="10" y="64" font-size="10" font-family="monospace" fill="#000000">+ event_name: TEXT</text>
      <text x="10" y="82" font-size="10" font-family="monospace" fill="#000000">+ metadata: JSONB</text>
      <text x="10" y="100" font-size="10" font-family="monospace" fill="#000000">+ created_at: TIMESTAMPTZ</text>
      <text x="10" y="118" font-size="9" font-style="italic" fill="#274e13">Zero-Knowledge event store</text>
    </g>
  </g>
</svg>
