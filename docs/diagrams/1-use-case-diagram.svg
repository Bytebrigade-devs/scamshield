<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#000000">Use Case Diagram — Module 5: Admin Dashboard, Analytics &amp; Operations</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="85" width="630" height="705" fill="#ffffff" stroke="#666666" stroke-width="2" filter="url(#drawio-shadow)" rx="4"/>
  <rect x="250" y="85" width="630" height="34" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="565" y="108" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">System Boundary: Module 5 (Admin Dashboard, Analytics &amp; Operations)</text>

  <!-- ================= ACTORS (LEFT - DRAW.IO STYLE) ================= -->

  <!-- Actor 1: System Administrator -->
  <g transform="translate(60, 190)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">System Administrator</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(Full Control / M5-10)</text>
  </g>

  <!-- Actor 2: Support Agent -->
  <g transform="translate(60, 430)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Support Agent</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(User Support &amp; Notes)</text>
  </g>

  <!-- Actor 3: Security Analyst -->
  <g transform="translate(60, 630)">
    <circle cx="50" cy="18" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="31" x2="50" y2="70" stroke="#000000" stroke-width="1.8"/>
    <line x1="20" y1="46" x2="80" y2="46" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="28" y2="108" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="72" y2="108" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="128" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Security Analyst</text>
    <text x="50" y="144" font-size="11" fill="#666666" text-anchor="middle">(Read-Only Telemetry)</text>
  </g>

  <!-- ================= SECONDARY SYSTEM (RIGHT) ================= -->
  <!-- Audit Database -->
  <g transform="translate(930, 420)">
    <rect x="0" y="0" width="180" height="80" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" rx="4" filter="url(#drawio-shadow)"/>
    <text x="90" y="24" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">&lt;&lt;Database Store&gt;&gt;</text>
    <text x="90" y="44" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">PostgreSQL (Supabase)</text>
    <text x="90" y="62" font-size="10" fill="#666666" text-anchor="middle">audit_logs &amp; events (M5-11)</text>
  </g>

  <!-- ================= MODULE 5 USE CASES (CLASSIC DRAW.IO BLUE OVALS) ================= -->

  <!-- UC1: Overview Dashboard -->
  <g id="uc1">
    <ellipse cx="420" cy="155" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="160" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">View Executive Overview (M5-14)</text>
  </g>

  <!-- UC2: Business Analytics -->
  <g id="uc2">
    <ellipse cx="420" cy="215" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="220" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Track Revenue &amp; Plans (M5-02, 03)</text>
  </g>

  <!-- UC3: Funnel & Cohort Retention -->
  <g id="uc3">
    <ellipse cx="420" cy="275" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="280" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Analyze Funnel &amp; Retention (M5-05, 06)</text>
  </g>

  <!-- UC4: Threat Intelligence Monitoring -->
  <g id="uc4">
    <ellipse cx="420" cy="335" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="340" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Monitor Scam Category Trends (M5-04)</text>
  </g>

  <!-- UC5: Search & Inspect Users -->
  <g id="uc5">
    <ellipse cx="420" cy="400" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="405" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Search &amp; Filter User Accounts (M5-09)</text>
  </g>

  <!-- UC6: Suspend / Reactivate User (Red accent border) -->
  <g id="uc6">
    <ellipse cx="420" cy="475" rx="140" ry="26" fill="#f8cecc" stroke="#b85450" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="420" y="474" font-size="12" font-weight="bold" fill="#b85450" text-anchor="middle">Suspend / Reactivate User (M5-09)</text>
    <text x="420" y="489" font-size="10" fill="#666666" text-anchor="middle">(Mandatory Justification Required)</text>
  </g>

  <!-- UC6_INC: Generate Audit Log (Green fill) -->
  <g id="uc6_inc">
    <ellipse cx="730" cy="475" rx="125" ry="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#drawio-shadow)"/>
    <text x="730" y="480" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">Append Immutable Audit Log (M5-11)</text>
  </g>

  <!-- UC7: Record Internal Support Note -->
  <g id="uc7">
    <ellipse cx="420" cy="545" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="550" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Record Internal Support Note (M5-09)</text>
  </g>

  <!-- UC8: Manage Support Tickets & Verdict Feedback -->
  <g id="uc8">
    <ellipse cx="420" cy="605" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="610" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Manage Tickets &amp; AI Disputes (M5-12)</text>
  </g>

  <!-- UC9: Query Audit Trail -->
  <g id="uc9">
    <ellipse cx="420" cy="665" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="670" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Query Audit Log Trail (M5-11)</text>
  </g>

  <!-- UC10: Export CSV -->
  <g id="uc10">
    <ellipse cx="420" cy="725" rx="140" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="730" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Export Analytics Report to CSV (M5-07)</text>
  </g>

  <!-- ================= CONNECTORS ================= -->

  <!-- Include connector UC6 -> UC6_INC -->
  <line x1="560" y1="475" x2="605" y2="475" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="600,471 605,475 600,479" fill="#333333"/>
  <text x="580" y="467" font-size="10" font-style="italic" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Admin Connector Lines -->
  <line x1="140" y1="250" x2="280" y2="155" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="215" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="275" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="335" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="400" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="475" stroke="#b85450" stroke-width="1.8"/>
  <line x1="140" y1="250" x2="280" y2="545" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="605" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="665" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="250" x2="280" y2="725" stroke="#333333" stroke-width="1.2"/>

  <!-- Support Agent Connectors -->
  <line x1="140" y1="490" x2="280" y2="155" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="140" y1="490" x2="280" y2="400" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="490" x2="280" y2="545" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="490" x2="280" y2="605" stroke="#666666" stroke-width="1.2"/>

  <!-- Security Analyst Connectors -->
  <line x1="140" y1="690" x2="280" y2="155" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="140" y1="690" x2="280" y2="335" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="690" x2="280" y2="665" stroke="#666666" stroke-width="1.2"/>

  <!-- Audit Database Connection -->
  <line x1="855" y1="475" x2="930" y2="455" stroke="#333333" stroke-width="1.5"/>
  <polygon points="925,452 930,455 926,459" fill="#333333"/>
  <line x1="560" y1="665" x2="930" y2="475" stroke="#333333" stroke-width="1.2"/>

  <!-- Post-it Note for Module 5 Privacy & RBAC Rules -->
  <g transform="translate(620, 610)">
    <polygon points="0,0 230,0 250,20 250,150 0,150" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <polygon points="230,0 230,20 250,20" fill="#ffe599" stroke="#d6b656" stroke-width="1"/>
    <text x="15" y="24" font-size="11" font-weight="bold" fill="#b45f06">Module 5 Rules &amp; RBAC</text>
    <text x="15" y="44" font-size="10" fill="#333333">• M5-10: Only Admin can suspend</text>
    <text x="15" y="62" font-size="10" fill="#333333">• Support role: view &amp; notes only</text>
    <text x="15" y="80" font-size="10" fill="#333333">• Analyst role: telemetry read-only</text>
    <text x="15" y="98" font-size="10" fill="#333333">• M5-11: Audit log is append-only</text>
    <text x="15" y="116" font-size="10" fill="#333333">• Passwords &amp; messages blocked</text>
    <text x="15" y="136" font-size="10" font-style="italic" fill="#666666">IS2901 Module 5 Scope</text>
  </g>
</svg>
