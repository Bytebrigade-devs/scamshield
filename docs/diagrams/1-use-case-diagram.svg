<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 860" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#000000">Use Case Diagram — Module 5: Admin Dashboard, Analytics &amp; Operations</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="230" y="85" width="730" height="745" fill="#ffffff" stroke="#666666" stroke-width="2" filter="url(#drawio-shadow)" rx="4"/>
  <rect x="230" y="85" width="730" height="34" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="595" y="108" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">System Boundary: Module 5 (Admin Dashboard, Analytics &amp; Operations)</text>

  <!-- ================= ACTORS (LEFT - DRAW.IO STYLE) ================= -->

  <!-- Actor 1: System Administrator -->
  <g transform="translate(50, 200)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">System Administrator</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(Full Control / M5-10)</text>
  </g>

  <!-- Actor 2: Support Agent -->
  <g transform="translate(50, 440)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Support Agent</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(User Support &amp; Notes)</text>
  </g>

  <!-- Actor 3: Security Analyst -->
  <g transform="translate(50, 640)">
    <circle cx="50" cy="18" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="31" x2="50" y2="70" stroke="#000000" stroke-width="1.8"/>
    <line x1="20" y1="46" x2="80" y2="46" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="28" y2="108" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="72" y2="108" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="128" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Security Analyst</text>
    <text x="50" y="144" font-size="11" fill="#666666" text-anchor="middle">(Read-Only Telemetry)</text>
  </g>

  <!-- ================= SECONDARY SYSTEM (RIGHT) ================= -->
  <g transform="translate(990, 440)">
    <rect x="0" y="0" width="190" height="90" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" rx="4" filter="url(#drawio-shadow)"/>
    <text x="95" y="24" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">&lt;&lt;Database Store&gt;&gt;</text>
    <text x="95" y="44" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">PostgreSQL (Supabase)</text>
    <text x="95" y="62" font-size="10" fill="#666666" text-anchor="middle">audit_logs &amp; automated_alerts</text>
    <text x="95" y="76" font-size="9" fill="#274e13" text-anchor="middle">🔒 Append-Only Storage</text>
  </g>

  <!-- ================= LEFT COLUMN USE CASES (CLASSIC BLUE OVALS) ================= -->

  <!-- UC1: Overview Dashboard -->
  <g id="uc1">
    <ellipse cx="400" cy="155" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="160" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">View Executive Overview (M5-14)</text>
  </g>

  <!-- UC2: Business Analytics -->
  <g id="uc2">
    <ellipse cx="400" cy="215" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="220" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Track Revenue &amp; Plans (M5-02, 03)</text>
  </g>

  <!-- UC3: Funnel & Cohort Retention -->
  <g id="uc3">
    <ellipse cx="400" cy="275" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="280" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Analyze Funnel &amp; Retention (M5-05, 06)</text>
  </g>

  <!-- UC4: Threat Intelligence Monitoring -->
  <g id="uc4">
    <ellipse cx="400" cy="335" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="340" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Monitor Scam Category Trends (M5-04)</text>
  </g>

  <!-- UC5: Search & Inspect Users -->
  <g id="uc5">
    <ellipse cx="400" cy="400" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="405" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Search &amp; Filter User Accounts (M5-09)</text>
  </g>

  <!-- UC6: Suspend / Reactivate User (Red accent border) -->
  <g id="uc6">
    <ellipse cx="400" cy="475" rx="135" ry="26" fill="#f8cecc" stroke="#b85450" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="400" y="474" font-size="12" font-weight="bold" fill="#b85450" text-anchor="middle">Suspend / Reactivate User (M5-09)</text>
    <text x="400" y="489" font-size="10" fill="#666666" text-anchor="middle">(Mandatory Justification Required)</text>
  </g>

  <!-- UC7: Record Internal Support Note -->
  <g id="uc7">
    <ellipse cx="400" cy="545" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="550" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Record Internal Support Note (M5-09)</text>
  </g>

  <!-- UC8: Manage Support Tickets & Verdict Feedback -->
  <g id="uc8">
    <ellipse cx="400" cy="605" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="610" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Manage Tickets &amp; AI Disputes (M5-12)</text>
  </g>

  <!-- UC9: Query Audit Trail -->
  <g id="uc9">
    <ellipse cx="400" cy="665" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="670" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Query Audit Log Trail (M5-11)</text>
  </g>

  <!-- UC10: Export CSV -->
  <g id="uc10">
    <ellipse cx="400" cy="725" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="400" y="730" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Export Analytics Report to CSV (M5-07)</text>
  </g>

  <!-- ================= RIGHT COLUMN: AUTOMATED ALERTS, ANOMALY & RECOMMENDED ACTIONS ================= -->

  <!-- UC11: Monitor Automated Alerts (⭐ A) -->
  <g id="uc11">
    <ellipse cx="780" cy="155" rx="150" ry="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="780" y="153" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">⭐ Monitor Automated Alerts</text>
    <text x="780" y="169" font-size="10" fill="#666666" text-anchor="middle">(Failed Logins, Vault Down, Missing Score Inputs)</text>
  </g>

  <!-- UC12: Detect 7-Day Baseline Anomalies (⭐ B) -->
  <g id="uc12">
    <ellipse cx="780" cy="235" rx="150" ry="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="780" y="233" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">⭐ Detect 7-Day Baseline Anomalies</text>
    <text x="780" y="249" font-size="10" fill="#b85450" text-anchor="middle">(e.g., Potential Scam Warnings +40% Surge)</text>
  </g>

  <!-- UC13: View Recommended Admin Actions (⭐ C) -->
  <g id="uc13">
    <ellipse cx="780" cy="315" rx="150" ry="26" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="780" y="313" font-size="12" font-weight="bold" fill="#b45f06" text-anchor="middle">⭐ View Recommended Admin Actions</text>
    <text x="780" y="329" font-size="10" fill="#333333" text-anchor="middle">(Rule-Based Action Matrix Guidance)</text>
  </g>

  <!-- UC14: Execute Investigatory Action -->
  <g id="uc14">
    <ellipse cx="780" cy="395" rx="150" ry="26" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="780" y="393" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Execute Investigatory Action</text>
    <text x="780" y="409" font-size="10" fill="#666666" text-anchor="middle">(Review Logs / Component Health / Scam Trends)</text>
  </g>

  <!-- UC6_INC: Generate Audit Log (Green fill) -->
  <g id="uc6_inc">
    <ellipse cx="780" cy="485" rx="140" ry="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#drawio-shadow)"/>
    <text x="780" y="490" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">Append Immutable Audit Log (M5-11)</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->

  <!-- Include connector UC6 -> UC6_INC -->
  <line x1="535" y1="475" x2="640" y2="485" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="635,481 640,485 635,489" fill="#333333"/>
  <text x="585" y="470" font-size="10" font-style="italic" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Include connector UC11 -> UC12 (Alerts includes Anomaly Detection) -->
  <line x1="780" y1="181" x2="780" y2="209" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="776,204 780,209 784,204" fill="#333333"/>
  <text x="825" y="198" font-size="10" font-style="italic" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Include connector UC11 -> UC13 (Alerts includes Recommended Actions) -->
  <line x1="880" y1="175" x2="910" y2="175" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="910" y1="175" x2="910" y2="315" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="910" y1="315" x2="930" y2="315" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="885,311 880,315 885,319" fill="#333333"/>
  <text x="915" y="260" font-size="10" font-style="italic" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend connector UC13 -> UC14 (Recommended Action extends to Execution) -->
  <line x1="780" y1="341" x2="780" y2="369" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="776,346 780,341 784,346" fill="#333333"/>
  <text x="825" y="358" font-size="10" font-style="italic" fill="#333333">&lt;&lt;extend&gt;&gt;</text>

  <!-- Include connector UC14 -> UC6_INC (Investigation logged to audit store) -->
  <line x1="780" y1="421" x2="780" y2="461" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="776,456 780,461 784,456" fill="#333333"/>
  <text x="825" y="445" font-size="10" font-style="italic" fill="#333333">&lt;&lt;include&gt;&gt;</text>

  <!-- Admin Connector Lines -->
  <line x1="130" y1="260" x2="265" y2="155" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="215" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="275" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="335" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="400" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="475" stroke="#b85450" stroke-width="1.8"/>
  <line x1="130" y1="260" x2="265" y2="545" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="605" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="665" stroke="#333333" stroke-width="1.2"/>
  <line x1="130" y1="260" x2="265" y2="725" stroke="#333333" stroke-width="1.2"/>
  <!-- Admin connects to Alerts directly -->
  <line x1="130" y1="260" x2="630" y2="155" stroke="#004085" stroke-width="1.8"/>

  <!-- Support Agent Connectors -->
  <line x1="130" y1="500" x2="265" y2="155" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="130" y1="500" x2="265" y2="400" stroke="#666666" stroke-width="1.2"/>
  <line x1="130" y1="500" x2="265" y2="545" stroke="#666666" stroke-width="1.2"/>
  <line x1="130" y1="500" x2="265" y2="605" stroke="#666666" stroke-width="1.2"/>

  <!-- Security Analyst Connectors -->
  <line x1="130" y1="700" x2="265" y2="155" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="130" y1="700" x2="265" y2="335" stroke="#666666" stroke-width="1.2"/>
  <line x1="130" y1="700" x2="265" y2="665" stroke="#666666" stroke-width="1.2"/>
  <!-- Analyst can view alerts & anomalies -->
  <line x1="130" y1="700" x2="630" y2="235" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Audit Database Connection -->
  <line x1="920" y1="485" x2="990" y2="475" stroke="#333333" stroke-width="1.5"/>
  <polygon points="985,472 990,475 986,479" fill="#333333"/>
  <line x1="535" y1="665" x2="990" y2="495" stroke="#333333" stroke-width="1.2"/>

  <!-- Post-it Note: Rule Matrix & Recommendations (Classic draw.io Yellow Note) -->
  <g transform="translate(580, 560)">
    <polygon points="0,0 350,0 370,20 370,240 0,240" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <polygon points="350,0 350,20 370,20" fill="#ffe599" stroke="#d6b656" stroke-width="1"/>
    <text x="15" y="24" font-size="11" font-weight="bold" fill="#b45f06">⭐ Rule-Based Action Matrix &amp; M5 Rules</text>
    
    <text x="15" y="46" font-size="10" font-weight="bold" fill="#000000">Detected Event &#8594; Suggested Admin Action:</text>
    <text x="15" y="66" font-size="10" fill="#333333">• Failed login attempts &#8594; <tspan font-weight="bold" fill="#004085">Review authentication logs</tspan></text>
    <text x="15" y="86" font-size="10" fill="#333333">• Password Vault offline &#8594; <tspan font-weight="bold" fill="#b85450">Investigate component health</tspan></text>
    <text x="15" y="106" font-size="10" fill="#333333">• Incomplete score inputs &#8594; <tspan font-weight="bold" fill="#274e13">Check data integration</tspan></text>
    <text x="15" y="126" font-size="10" fill="#333333">• +40% scam check surge &#8594; <tspan font-weight="bold" fill="#b45f06">Review scam activity trends</tspan></text>
    
    <line x1="15" y1="140" x2="355" y2="140" stroke="#d6b656" stroke-width="1"/>
    
    <text x="15" y="160" font-size="10" fill="#333333">• <tspan font-weight="bold">7-Day Rolling Baseline:</tspan> Flags deviations vs. prev 7 days</text>
    <text x="15" y="180" font-size="10" fill="#333333">• M5-10: Only Admin can suspend accounts</text>
    <text x="15" y="200" font-size="10" fill="#333333">• M5-11: Audit log is append-only</text>
    <text x="15" y="220" font-size="9" font-style="italic" fill="#274e13">🔒 Zero Raw-Content: Plaintext passwords &amp; messages excluded</text>
  </g>
</svg>
