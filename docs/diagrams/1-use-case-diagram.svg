    <ellipse cx="420" cy="365" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="369" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-04: Search &amp; Inspect Users (M5-09)</text>
  </g>

  <!-- UC5: Suspend / Reactivate User -->
  <g id="uc5">
    <ellipse cx="420" cy="445" rx="130" ry="26" fill="url(#grad-uc)" stroke="#f06a6a" stroke-width="1.5"/>
    <text x="420" y="443" font-size="11" font-weight="700" fill="#f06a6a" text-anchor="middle">UC-05: Suspend / Reactivate Account</text>
    <text x="420" y="457" font-size="10" fill="#8ea0b3" text-anchor="middle">(M5-09 · Requires Justification)</text>
  </g>

  <!-- UC5_INC: Generate Audit Log -->
  <g id="uc5_inc">
    <ellipse cx="730" cy="445" rx="120" ry="24" fill="url(#grad-uc)" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="730" y="449" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">UC-05A: Write Immutable Audit Log (M5-11)</text>
  </g>

  <!-- UC6: Record Internal Support Note -->
  <g id="uc6">
    <ellipse cx="420" cy="520" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="524" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-06: Add Internal Support Note (M5-09)</text>
  </g>

  <!-- UC7: Review Audit Log -->
  <g id="uc7">
    <ellipse cx="420" cy="580" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="584" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-07: Query Audit Trail (M5-11)</text>
  </g>

  <!-- UC8: Export CSV -->
  <g id="uc8">
    <ellipse cx="420" cy="640" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="644" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-08: Export Data to CSV (M5-07)</text>
  </g>

  <!-- UC9: Support Tickets & Feedback -->
  <g id="uc9">
    <ellipse cx="420" cy="700" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="704" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-09: Support Tickets &amp; Feedback (M5-12)</text>
  </g>

  <!-- UC10: Module 6 Safety Score View -->
  <g id="uc10">
    <ellipse cx="420" cy="758" rx="135" ry="22" fill="url(#grad-uc)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="420" y="762" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">UC-10: Review Safety Score Cohorts (M6-05)</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->

  <!-- Include relationship UC5 -> UC5_INC -->
  <line x1="550" y1="445" x2="610" y2="445" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="605,441 613,445 605,449" fill="#34d399"/>
  <text x="580" y="438" font-size="10" font-style="italic" fill="#34d399" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Admin Associations (Lines from Actor to UCs) -->
  <line x1="150" y1="270" x2="290" y2="175" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="235" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="295" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="365" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="445" stroke="#2dd4bf" stroke-width="1.8"/>
  <line x1="150" y1="270" x2="290" y2="520" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="580" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="640" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="700" stroke="#8ea0b3" stroke-width="1.2"/>
  <line x1="150" y1="270" x2="290" y2="758" stroke="#8ea0b3" stroke-width="1.2"/>

  <!-- Support Agent Associations -->
  <line x1="150" y1="500" x2="290" y2="175" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="150" y1="500" x2="290" y2="365" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="150" y1="500" x2="290" y2="520" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="150" y1="500" x2="290" y2="700" stroke="#f59e0b" stroke-width="1.2"/>

  <!-- Security Analyst Associations -->
  <line x1="150" y1="690" x2="290" y2="175" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="150" y1="690" x2="290" y2="295" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="150" y1="690" x2="290" y2="580" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="150" y1="690" x2="290" y2="758" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Secondary System Connections -->
  <line x1="850" y1="445" x2="930" y2="310" stroke="#34d399" stroke-width="1.2"/>
  <line x1="550" y1="295" x2="930" y2="510" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="550" y1="580" x2="930" y2="310" stroke="#34d399" stroke-width="1.2"/>

  <!-- Privacy Boundary Annotation -->
  <g transform="translate(620, 640)">
    <rect x="0" y="0" width="250" height="130" rx="8" fill="#13203a" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="15" y="24" font-size="11" font-weight="700" fill="#2dd4bf">🔒 ZERO-KNOWLEDGE BOUNDARY</text>
    <text x="15" y="44" font-size="10" fill="#eaf1f7">• No vault passwords or notes exposed</text>
    <text x="15" y="62" font-size="10" fill="#eaf1f7">• No raw scam message bodies stored</text>
    <text x="15" y="80" font-size="10" fill="#eaf1f7">• Mock billing only (no card numbers)</text>
    <text x="15" y="98" font-size="10" fill="#eaf1f7">• Mandatory justification on suspension</text>
    <text x="15" y="116" font-size="10" fill="#34d399">• Audit log is strictly append-only</text>
  </g>
