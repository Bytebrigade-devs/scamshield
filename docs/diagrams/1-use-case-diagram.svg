<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background:#080e1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#13203a" />
    </linearGradient>
    <linearGradient id="grad-uc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13203a" />
      <stop offset="100%" stop-color="#1e2e4a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Metadata -->
  <text x="50" y="45" font-size="22" font-weight="700" fill="#eaf1f7">ScamShield · Module 5 &amp; Module 6 Use Case Diagram</text>
  <text x="50" y="70" font-size="12" fill="#8ea0b3">UML 2.5 Specification · Owner: Vishmi Himaya (245027T) · Byte Brigade · IS2901 Software Development Project</text>

  <!-- System Boundary Box -->
  <rect x="260" y="100" width="630" height="690" rx="16" fill="url(#grad-box)" stroke="#1f2d45" stroke-width="2" filter="url(#shadow)"/>
  <rect x="260" y="100" width="630" height="38" rx="16" fill="#13203a"/>
  <rect x="260" y="122" width="630" height="16" fill="#13203a"/>
  <text x="280" y="125" font-size="13" font-weight="700" fill="#2dd4bf" letter-spacing="0.5">SYSTEM BOUNDARY: MODULE 5 (ADMIN &amp; OPERATIONS) &amp; MODULE 6 (SAFETY SCORE COORDINATION)</text>

  <!-- ================= ACTORS (LEFT) ================= -->

  <!-- Actor 1: Administrator -->
  <g transform="translate(60, 210)">
    <circle cx="50" cy="25" r="16" fill="#13203a" stroke="#2dd4bf" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="85" stroke="#2dd4bf" stroke-width="2.5"/>
    <line x1="15" y1="58" x2="85" y2="58" stroke="#2dd4bf" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="25" y2="125" stroke="#2dd4bf" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="75" y2="125" stroke="#2dd4bf" stroke-width="2.5"/>
    <text x="50" y="148" font-size="13" font-weight="700" fill="#eaf1f7" text-anchor="middle">Administrator</text>
    <text x="50" y="164" font-size="11" fill="#2dd4bf" text-anchor="middle">(Full Control / M5-10)</text>
  </g>

  <!-- Actor 2: Support Agent -->
  <g transform="translate(60, 440)">
    <circle cx="50" cy="25" r="16" fill="#13203a" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="50" y1="41" x2="50" y2="85" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="15" y1="58" x2="85" y2="58" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="25" y2="125" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="50" y1="85" x2="75" y2="125" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="50" y="148" font-size="13" font-weight="700" fill="#eaf1f7" text-anchor="middle">Support Agent</text>
    <text x="50" y="164" font-size="11" fill="#f59e0b" text-anchor="middle">(User Support / Notes)</text>
  </g>

  <!-- Actor 3: Security Analyst -->
  <g transform="translate(60, 630)">
    <circle cx="50" cy="20" r="15" fill="#13203a" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="50" y1="35" x2="50" y2="75" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="50" y1="75" x2="30" y2="110" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="50" y1="75" x2="70" y2="110" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="50" y="130" font-size="13" font-weight="700" fill="#eaf1f7" text-anchor="middle">Security Analyst</text>
    <text x="50" y="146" font-size="11" fill="#38bdf8" text-anchor="middle">(Telemetry &amp; Audit)</text>
  </g>

  <!-- ================= SECONDARY ACTORS (RIGHT) ================= -->
  <!-- Supabase DB Actor -->
  <g transform="translate(930, 260)">
    <rect x="0" y="0" width="170" height="70" rx="8" fill="#13203a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="85" y="28" font-size="11" fill="#34d399" font-weight="600" text-anchor="middle">&lt;&lt;Secondary System&gt;&gt;</text>
    <text x="85" y="46" font-size="13" font-weight="700" fill="#eaf1f7" text-anchor="middle">Supabase PostgreSQL</text>
    <text x="85" y="60" font-size="10" fill="#8ea0b3" text-anchor="middle">Audit Logs &amp; Events (X-08)</text>
  </g>

  <!-- M4 AI Scam Pipeline System -->
  <g transform="translate(930, 480)">
    <rect x="0" y="0" width="170" height="70" rx="8" fill="#13203a" stroke="#2dd4bf" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="85" y="28" font-size="11" fill="#2dd4bf" font-weight="600" text-anchor="middle">&lt;&lt;Subsystem M4&gt;&gt;</text>
    <text x="85" y="46" font-size="13" font-weight="700" fill="#eaf1f7" text-anchor="middle">AI Scam Pipeline</text>
    <text x="85" y="60" font-size="10" fill="#8ea0b3" text-anchor="middle">X-13 Taxonomy Stream</text>
  </g>

  <!-- ================= USE CASES (ELLIPSES) ================= -->

  <!-- UC1: Overview Dashboard -->
  <g id="uc1">
    <ellipse cx="420" cy="175" rx="130" ry="24" fill="url(#grad-uc)" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="420" y="179" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-01: View Overview Dashboard (M5-14)</text>
  </g>

  <!-- UC2: Business Analytics -->
  <g id="uc2">
    <ellipse cx="420" cy="235" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="239" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-02: Monitor Business &amp; MRR (M5-03, 05)</text>
  </g>

  <!-- UC3: AI Scam Threat Intelligence -->
  <g id="uc3">
    <ellipse cx="420" cy="295" rx="130" ry="24" fill="url(#grad-uc)" stroke="#1f2d45" stroke-width="1.5"/>
    <text x="420" y="299" font-size="11" font-weight="600" fill="#eaf1f7" text-anchor="middle">UC-03: Analyze Threat Vectors (M5-04)</text>
  </g>

