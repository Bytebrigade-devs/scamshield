<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background:#ffffff; font-family: Helvetica, Arial, sans-serif;">
  <!-- Grid Background (Draw.io style) -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0f0f0" stroke-width="1"/>
    </pattern>
    <filter id="drawio-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Diagram Title Banner -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#000000">Use Case Diagram — ScamShield (Module 5 &amp; Module 6)</text>
  <text x="40" y="60" font-size="12" fill="#666666">IS2901 Software Development Project · Byte Brigade · Author: Vishmi Himaya (245027T)</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="90" width="640" height="700" fill="#ffffff" stroke="#666666" stroke-width="2" filter="url(#drawio-shadow)" rx="4"/>
  <rect x="250" y="90" width="640" height="34" fill="#f5f5f5" stroke="#666666" stroke-width="1"/>
  <text x="570" y="113" font-size="13" font-weight="bold" fill="#333333" text-anchor="middle">System Boundary: ScamShield Admin &amp; Operations Subsystem</text>

  <!-- ================= ACTORS (LEFT - CLASSIC DRAW.IO STYLE) ================= -->

  <!-- Actor 1: Administrator -->
  <g transform="translate(60, 200)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Administrator</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(Full Moderation)</text>
  </g>

  <!-- Actor 2: Support Agent -->
  <g transform="translate(60, 440)">
    <circle cx="50" cy="20" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="34" x2="50" y2="78" stroke="#000000" stroke-width="1.8"/>
    <line x1="16" y1="50" x2="84" y2="50" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="24" y2="120" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="78" x2="76" y2="120" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="142" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Support Agent</text>
    <text x="50" y="158" font-size="11" fill="#666666" text-anchor="middle">(Notes &amp; Tickets)</text>
  </g>

  <!-- Actor 3: Security Analyst -->
  <g transform="translate(60, 630)">
    <circle cx="50" cy="18" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="31" x2="50" y2="70" stroke="#000000" stroke-width="1.8"/>
    <line x1="20" y1="46" x2="80" y2="46" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="28" y2="108" stroke="#000000" stroke-width="1.8"/>
    <line x1="50" y1="70" x2="72" y2="108" stroke="#000000" stroke-width="1.8"/>
    <text x="50" y="128" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Security Analyst</text>
    <text x="50" y="144" font-size="11" fill="#666666" text-anchor="middle">(Read-Only Telemetry)</text>
  </g>

  <!-- ================= SECONDARY SYSTEMS (RIGHT) ================= -->
  <!-- Database Box -->
  <g transform="translate(930, 270)">
    <rect x="0" y="0" width="180" height="75" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" rx="4" filter="url(#drawio-shadow)"/>
    <text x="90" y="24" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">&lt;&lt;Secondary System&gt;&gt;</text>
    <text x="90" y="44" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Supabase PostgreSQL</text>
    <text x="90" y="60" font-size="10" fill="#666666" text-anchor="middle">Audit Logs &amp; Events (X-08)</text>
  </g>

  <!-- M4 AI Scam Pipeline System -->
  <g transform="translate(930, 480)">
    <rect x="0" y="0" width="180" height="75" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" rx="4" filter="url(#drawio-shadow)"/>
    <text x="90" y="24" font-size="11" font-style="italic" fill="#666666" text-anchor="middle">&lt;&lt;Subsystem M4&gt;&gt;</text>
    <text x="90" y="44" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">AI Scam Pipeline</text>
    <text x="90" y="60" font-size="10" fill="#666666" text-anchor="middle">X-13 Taxonomy Stream</text>
  </g>

  <!-- ================= USE CASES (CLASSIC DRAW.IO BLUE OVALS: #dae8fc / #6c8ebf) ================= -->

  <!-- UC1: Overview Dashboard -->
  <g id="uc1">
    <ellipse cx="420" cy="165" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="170" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">View Executive Overview (M5-14)</text>
  </g>

  <!-- UC2: Business Analytics -->
  <g id="uc2">
    <ellipse cx="420" cy="225" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="230" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Monitor Business &amp; MRR (M5-03, 05)</text>
  </g>

  <!-- UC3: AI Scam Threat Intelligence -->
  <g id="uc3">
    <ellipse cx="420" cy="285" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="290" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Analyze Threat Vectors (M5-04)</text>
  </g>

  <!-- UC4: Search & Inspect Users -->
  <g id="uc4">
    <ellipse cx="420" cy="355" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="360" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Search &amp; Inspect Users (M5-09)</text>
  </g>

  <!-- UC5: Suspend / Reactivate User (Red accent border) -->
  <g id="uc5">
    <ellipse cx="420" cy="435" rx="135" ry="26" fill="#f8cecc" stroke="#b85450" stroke-width="1.8" filter="url(#drawio-shadow)"/>
    <text x="420" y="434" font-size="12" font-weight="bold" fill="#b85450" text-anchor="middle">Suspend / Reactivate Account</text>
    <text x="420" y="449" font-size="10" fill="#666666" text-anchor="middle">(M5-09 · Requires Justification)</text>
  </g>

  <!-- UC5_INC: Generate Audit Log (Green fill #d5e8d4 / #82b366) -->
  <g id="uc5_inc">
    <ellipse cx="730" cy="435" rx="125" ry="24" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#drawio-shadow)"/>
    <text x="730" y="440" font-size="11" font-weight="bold" fill="#274e13" text-anchor="middle">Write Immutable Audit Log (M5-11)</text>
  </g>

  <!-- UC6: Record Internal Support Note -->
  <g id="uc6">
    <ellipse cx="420" cy="510" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="515" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Add Internal Support Note (M5-09)</text>
  </g>

  <!-- UC7: Review Audit Log -->
  <g id="uc7">
    <ellipse cx="420" cy="570" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="575" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Query Audit Trail (M5-11)</text>
  </g>

  <!-- UC8: Export CSV -->
  <g id="uc8">
    <ellipse cx="420" cy="630" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="635" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Export Analytics to CSV (M5-07)</text>
  </g>

  <!-- UC9: Support Tickets & Feedback -->
  <g id="uc9">
    <ellipse cx="420" cy="690" rx="135" ry="24" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="695" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Support Tickets &amp; Feedback (M5-12)</text>
  </g>

  <!-- UC10: Module 6 Safety Score View -->
  <g id="uc10">
    <ellipse cx="420" cy="750" rx="135" ry="22" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <text x="420" y="755" font-size="12" font-weight="bold" fill="#274e13" text-anchor="middle">Review Safety Score Cohorts (M6-05)</text>
  </g>

  <!-- ================= CONNECTORS (SOLID DRAW.IO ARROWS) ================= -->

  <!-- Include connector UC5 -> UC5_INC -->
  <line x1="555" y1="435" x2="605" y2="435" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="600,431 605,435 600,439" fill="#333333"/>
  <text x="580" y="427" font-size="10" font-style="italic" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Admin Connector Lines -->
  <line x1="140" y1="260" x2="285" y2="165" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="225" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="285" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="355" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="435" stroke="#b85450" stroke-width="1.6"/>
  <line x1="140" y1="260" x2="285" y2="510" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="570" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="630" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="690" stroke="#333333" stroke-width="1.2"/>
  <line x1="140" y1="260" x2="285" y2="750" stroke="#333333" stroke-width="1.2"/>

  <!-- Support Agent Connectors -->
  <line x1="140" y1="500" x2="285" y2="165" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="140" y1="500" x2="285" y2="355" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="500" x2="285" y2="510" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="500" x2="285" y2="690" stroke="#666666" stroke-width="1.2"/>

  <!-- Security Analyst Connectors -->
  <line x1="140" y1="690" x2="285" y2="165" stroke="#666666" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="140" y1="690" x2="285" y2="285" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="690" x2="285" y2="570" stroke="#666666" stroke-width="1.2"/>
  <line x1="140" y1="690" x2="285" y2="750" stroke="#666666" stroke-width="1.2"/>

  <!-- Secondary System Connectors -->
  <line x1="855" y1="435" x2="930" y2="310" stroke="#333333" stroke-width="1.2"/>
  <line x1="555" y1="285" x2="930" y2="515" stroke="#333333" stroke-width="1.2"/>
  <line x1="555" y1="570" x2="930" y2="310" stroke="#333333" stroke-width="1.2"/>

  <!-- ================= POST-IT NOTE (CLASSIC DRAW.IO YELLOW NOTE: #fff2cc / #d6b656) ================= -->
  <g transform="translate(615, 625)">
    <polygon points="0,0 240,0 260,20 260,145 0,145" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" filter="url(#drawio-shadow)"/>
    <polygon points="240,0 240,20 260,20" fill="#ffe599" stroke="#d6b656" stroke-width="1"/>
    <text x="15" y="24" font-size="11" font-weight="bold" fill="#b45f06">Zero-Knowledge Boundary</text>
    <text x="15" y="44" font-size="10" fill="#333333">• Passwords/notes never shown to Admin</text>
    <text x="15" y="62" font-size="10" fill="#333333">• Raw scam messages never logged</text>
    <text x="15" y="80" font-size="10" fill="#333333">• Mock billing only (no card numbers)</text>
    <text x="15" y="98" font-size="10" fill="#333333">• Mandatory justification on suspension</text>
    <text x="15" y="116" font-size="10" fill="#333333">• Audit log is strictly append-only</text>
    <text x="15" y="134" font-size="10" font-style="italic" fill="#666666">(IS2901 Moratuwa Security Boundary)</text>
  </g>
</svg>
