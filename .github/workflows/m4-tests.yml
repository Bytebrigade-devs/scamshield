name: M4 library tests

on:
  pull_request:
    paths:
      - 'src/lib/scam-checker/**'
      - '.github/workflows/m4-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/scam-checker/**'
      - '.github/workflows/m4-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Run network-free library regressions (no dependency installation)
        run: node --test src/lib/scam-checker/*.test.ts
